<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RobotAttack Control Panel</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      label { display: block; margin: 0.5rem 0; }
      button { margin-right: 0.75rem; }
      .row { margin: 1rem 0; }
      code { background: #f3f3f3; padding: 0.2rem 0.4rem; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>RobotAttack Control Panel</h1>

    <section>
      <h2>Launch Human Game</h2>
      <label>Seed (optional): <input id="seed" type="number" placeholder="fresh per run"></label>
      <button id="launch">Launch Human Game</button>
    </section>

    <section>
      <h2>Telemetry</h2>
      <button id="open-telemetry">Open Telemetry JSON</button>
    </section>

    <section>
      <h2>Launch AI Demo (Replay)</h2>
      <p id="aidemo-hint">AI Demo URL will be constructed from configured port.</p>
      <label>Recording URL (on AI Demo server): 
        <input id="recUrl" type="text" placeholder="/data/recordings/sample-replay.json" style="width: 24rem;">
      </label>
      <button id="launch-aidemo">Launch AI Demo</button>
    </section>

    <script>
      let aiDemoPort = 3001;

      async function loadServerConfig() {
        try {
          const r = await fetch('/server-config.json', { cache: 'no-store' });
          if (r.ok) {
            const cfg = await r.json();
            aiDemoPort = cfg.aiDemoPort || aiDemoPort;
            document.getElementById('aidemo-hint').textContent =
              `AI Demo expected at http://localhost:${aiDemoPort}/AIDemo/index.html`;
          }
        } catch {}
      }

      document.getElementById('launch').onclick = () => {
        const seed = document.getElementById('seed').value;
        const url = seed ? `index.html?seed=${encodeURIComponent(seed)}` : 'index.html';
        window.open(url, '_blank', 'noopener');
      };
      document.getElementById('open-telemetry').onclick = () => {
        window.open('data/human-telemetry.json', '_blank', 'noopener');
      };
      document.getElementById('launch-aidemo').onclick = () => {
        const rec = document.getElementById('recUrl').value || '/data/recordings/sample-replay.json';
        const url = `http://localhost:${aiDemoPort}/AIDemo/index.html?rec=${encodeURIComponent(rec)}`;
        window.open(url, '_blank', 'noopener');
      };

      loadServerConfig();
    </script>
  </body>
</html>
