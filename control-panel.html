<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RobotAttack Control Panel</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      label { display: block; margin: 0.5rem 0; }
      button { margin-right: 0.75rem; }
      .row { margin: 1rem 0; }
      code { background: #f3f3f3; padding: 0.2rem 0.4rem; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>RobotAttack Control Panel</h1>

    <section class="row">
      <h2>Launch Human Game</h2>
      <label>Seed (optional): <input id="seed" type="number" placeholder="fresh per run"></label>
      <button id="launch">Launch Human Game</button>
      <button id="launch-record">Record New Human Session</button>
    </section>

    <section class="row">
      <h2>Telemetry</h2>
      <button id="open-telemetry">Open Human Telemetry JSON</button>
      <button id="open-aidemo-telemetry">Open AI Demo Telemetry JSON</button>
    </section>

    <section class="row">
      <h2>Launch AI Demo (Replay)</h2>
      <p id="aidemo-hint">AI Demo expected at http://localhost:3001/AIDemo/index.html</p>
      <div>
        <button id="open-aidemo-home">Open AI Demo Home</button>
        <button id="refresh-recs">Refresh Recordings</button>
      </div>
      <label>Recording URL (on AI Demo server):
        <input id="recUrl" type="text" placeholder="/data/recordings/sample-replay.json" style="width: 28rem;" list="recList">
        <datalist id="recList"></datalist>
      </label>
      <div id="lastRec" style="font:12px/1.4 sans-serif;color:#555;margin-top:6px;"></div>
      <button id="launch-aidemo">Launch AI Demo</button>
      <div id="recStatus" style="font:12px/1.4 sans-serif;color:#555;margin-top:6px;"></div>
    </section>

    <script>
      let aiDemoPort = 3001;

      async function loadServerConfig() {
        try {
          const r = await fetch('/server-config.json', { cache: 'no-store' });
          if (r.ok) {
            const cfg = await r.json();
            aiDemoPort = cfg.aiDemoPort || aiDemoPort;
            document.getElementById('aidemo-hint').textContent =
              `AI Demo expected at http://localhost:${aiDemoPort}/AIDemo/index.html`;
          }
        } catch {}
      }

      async function populateRecordings() {
        const status = document.getElementById('recStatus');
        status.textContent = 'Loading recordings...';
        try {
          const r = await fetch(`http://localhost:${aiDemoPort}/recordings`, { cache: 'no-store' });
          if (!r.ok) { status.textContent = 'Failed to load recordings.'; return; }
          const data = await r.json();
          const list = document.getElementById('recList');
          list.innerHTML = '';
          (data.files || []).forEach(f => {
            const opt = document.createElement('option');
            opt.value = `/data/recordings/${f}`;
            list.appendChild(opt);
          });
          status.textContent = `${(data.files || []).length} recording(s) found on AI Demo server.`;
        } catch (e) {
          status.textContent = 'Failed to load recordings.';
        }
      }

      async function prefillLatestFromHuman() {
        try {
          const r = await fetch('/recordings/latest', { cache: 'no-store' });
          if (!r.ok) return;
          const data = await r.json();
          if (data && data.path) {
            const input = document.getElementById('recUrl');
            input.value = data.path;
            const lastRec = document.getElementById('lastRec');
            lastRec.textContent = `Last saved recording: ${data.path}`;
          }
        } catch {}
      }

      document.getElementById('launch').onclick = () => {
        const seed = document.getElementById('seed').value;
        const url = seed ? `index.html?seed=${encodeURIComponent(seed)}` : 'index.html';
        window.open(url, '_blank', 'noopener');
      };
      document.getElementById('launch-record').onclick = () => {
        const seed = document.getElementById('seed').value;
        const params = new URLSearchParams();
        if (seed) params.set('seed', seed);
        params.set('record', '1');
        const url = `index.html?${params.toString()}`;
        window.open(url, '_blank', 'noopener');
      };
      document.getElementById('open-telemetry').onclick = () => {
        window.open('data/human-telemetry.json', '_blank', 'noopener');
      };
      document.getElementById('open-aidemo-telemetry').onclick = () => {
        window.open(`http://localhost:${aiDemoPort}/data/aidemo-telemetry.json`, '_blank', 'noopener');
      };
      document.getElementById('open-aidemo-home').onclick = () => {
        const url = `http://localhost:${aiDemoPort}/AIDemo/index.html`;
        window.open(url, '_blank', 'noopener');
      };
      document.getElementById('refresh-recs').onclick = () => populateRecordings();
      document.getElementById('launch-aidemo').onclick = () => {
        const rec = document.getElementById('recUrl').value || '/data/recordings/sample-replay.json';
        const url = `http://localhost:${aiDemoPort}/AIDemo/index.html?rec=${encodeURIComponent(rec)}`;
        window.open(url, '_blank', 'noopener');
      };

      (async function init() {
        await loadServerConfig();
        await populateRecordings();
        await prefillLatestFromHuman();
      })();
    </script>
  </body>
</html>
